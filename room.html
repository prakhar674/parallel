<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Parallel Room</title>  <link rel="stylesheet" href="room.css">
</head><body>  <!-- Background -->  <div class="background">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>  <!-- Top Bar -->  <header class="topbar"><a href="index.html" class="logo">
  <div class="logo-icon">P</div>
  <span>Parallel</span>
</a>

<div class="room-info">
  <span class="live-dot"></span>
  <span id="roomCodeDisplay">ROOM ------</span>
</div>

<button id="cinemaBtn" class="cinema-btn">
  🎬 Cinema Mode
</button>

  </header>  <!-- Main Layout -->  <main class="app"><!-- Left Side -->
<section class="main-area">

  <!-- Video Area -->
  <section class="video-section">

    <div class="section-heading">
      <div>
        <p class="eyebrow">CONNECTED SPACE</p>
        <h1>In Parallel</h1>
      </div>

      <div class="connection-status">
        <span></span>
        <span id="connectionText">Connecting...</span>
      </div>
    </div>

    <!-- Two Video Screens -->
    <div class="video-grid">

      <!-- Your Camera -->
      <div class="video-card">

        <video
          id="localVideo"
          autoplay
          muted
          playsinline>
        </video>

        <div class="video-placeholder" id="localPlaceholder">
          <span>👤</span>
          <p>Camera starting...</p>
        </div>

        <div class="video-label">
          <span id="localName">You</span>
          <span class="you-tag">YOU</span>
        </div>

      </div>

      <!-- Friend Camera -->
      <div class="video-card">

        <video
          id="remoteVideo"
          autoplay
          playsinline>
        </video>

        <div class="video-placeholder">
          <span>👤</span>
          <p id="remoteStatus">Waiting for friend...</p>
        </div>

        <div class="video-label">
          <span id="remoteName">Friend</span>
        </div>

      </div>

    </div>

    <!-- Call Controls -->
    <div class="call-controls">

      <button id="micBtn" class="control-btn" title="Toggle microphone">
        🎤
      </button>

      <button id="cameraBtn" class="control-btn" title="Toggle camera">
        📹
      </button>

      <button id="snapCameraBtn" class="control-btn accent" title="Take snap">
        📸
      </button>

      <button id="leaveBtn" class="control-btn leave" title="Leave room">
        📞
      </button>

    </div>

  </section>

  <!-- Snap Section -->
  <section class="snap-section">

    <div class="snap-header">
      <div>
        <p class="eyebrow">SHARED MOMENTS</p>
        <h2>Snap Window</h2>
      </div>

      <button id="uploadSnapBtn" class="small-btn">
        + Send Snap
      </button>

      <input
        type="file"
        id="snapInput"
        accept="image/*"
        hidden
      >

    </div>

    <div id="snapFeed" class="snap-feed">

      <div class="empty-snaps">
        <span>📸</span>
        <p>No snaps yet.</p>
        <small>Send a photo to share it here.</small>
      </div>

    </div>

  </section>

</section>

<!-- Chat Sidebar -->
<aside class="chat-panel">

  <div class="chat-header">
    <div>
      <p class="eyebrow">LIVE CONVERSATION</p>
      <h2>Chat</h2>
    </div>

    <span class="chat-count">2</span>
  </div>

  <div id="chatMessages" class="chat-messages">

    <div class="system-message">
      Welcome to your Parallel space ✦
    </div>

  </div>

  <form id="chatForm" class="chat-input-area">

    <input
      type="text"
      id="chatInput"
      placeholder="Write something..."
      autocomplete="off"
    >

    <button type="submit" id="sendBtn">
      ↑
    </button>

  </form>

</aside>

  </main>  <script src="room.js"></script></body>
</html>
